name: Incremental Bible Translation (Daily)

on:
  schedule:
    # Executa diariamente às 07:00 UTC (04:00 BRT) — janela segura de renovação da cota gratuita diária
    - cron: '0 7 * * *'
  workflow_dispatch: # Permite disparo manual com 1 clique pela aba Actions do GitHub

jobs:
  run-translation-batch:
    name: Translation Batch (Cloud)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Translate Batch (18 Gemini calls, multi-chapter batching)
        env:
          SUPABASE_URL: "https://jmtavlozxkmkeubekbjd.supabase.co"
          VITE_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImptdGF2bG96eGtta2V1YmVrYmpkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIxNzcwMzAsImV4cCI6MjA5Nzc1MzAzMH0.HW6-OjuevWDfnR2C5aJHthKpH0jBfx7R7vU_R3pznM8"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_ACTIONS: "true"
        # --limit=18: margem de segurança dentro das 20 chamadas gratuitas diárias
        run: node scripts/translate-batch.js --limit=18

      - name: Translation Summary
        if: always()
        run: |
          echo "### 🕊️ Resumo da Execução de Tradução" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: Concluído com sucesso" >> $GITHUB_STEP_SUMMARY
          echo "- **Motor**: Multi-capítulo por chamada (gemini-2.5-flash)" >> $GITHUB_STEP_SUMMARY
          echo "- **Persistência**: Supabase (original_bible_verses + translation_jobs)" >> $GITHUB_STEP_SUMMARY
          echo "- **Acompanhamento**: Abra o Dashboard no Supabase para ver o mapa visual em tempo real." >> $GITHUB_STEP_SUMMARY
