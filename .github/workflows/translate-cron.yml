name: Incremental Bible Translation Cron

on:
  schedule:
    # Run every 30 minutes to process small batches incrementally
    - cron: '*/30 * * * *'
  workflow_dispatch: # Allows manual execution from the GitHub Actions tab

jobs:
  run-translation-batch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Translate Batch
        env:
          # Supabase credentials (uses anon key fallback if service role is not defined)
          SUPABASE_URL: "https://jmtavlozxkmkeubekbjd.supabase.co"
          VITE_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImptdGF2bG96eGtta2V1YmVrYmpkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIxNzcwMzAsImV4cCI6MjA5Nzc1MzAzMH0.HW6-OjuevWDfnR2C5aJHthKpH0jBfx7R7vU_R3pznM8"
          
          # Secrets (Must be configured in your GitHub Repository Secrets)
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/translate-batch.js --limit=3
